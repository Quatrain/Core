name: Quatrain Core Sovereign CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://127.0.0.1:2375

jobs:
  ci:
    name: Monorepo Build, Tests & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack & Configure Yarn
        run: |
          echo "Node.js version: $(node -v)"
          corepack enable
          yarn --version

      - name: Install System Prerequisites
        run: |
          echo "=== Installing system build tools ==="
          if ! command -v docker > /dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3 make g++ docker.io
          else
            apt-get update -qq && apt-get install -y -qq python3 make g++
          fi

      - name: Start Isolated PostgreSQL Test Instance
        run: |
          echo "=== Starting PostgreSQL 15 on DinD ==="
          docker run -d --name pg-test \
            -p 5432:5432 \
            -e POSTGRES_DB=quatrain_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            postgres:15-alpine

          for i in $(seq 1 15); do
            docker exec pg-test pg_isready -U postgres >/dev/null 2>&1 && break
            echo "Waiting for PostgreSQL ($i/15)..."
            sleep 1
          done
          echo "PostgreSQL test instance is ready on localhost:5432"

      - name: Install Monorepo Dependencies
        run: |
          echo "=== Installing dependencies ==="
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Build Monorepo (Turbo)
        run: |
          echo "=== Building all monorepo packages ==="
          yarn build

      - name: Audit JSDoc Quality Gate
        run: |
          echo "=== Checking JSDoc compliance in core packages ==="
          OUTPUT=$(npx ts-node scripts/audit-jsdoc.ts | grep -E "\[Missing\] packages/(auth|backend|storage|studio|testing|worker)" || true)
          if [ -n "$OUTPUT" ]; then
            echo "JSDoc regressions detected in core packages:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "JSDoc quality gate passed."

      - name: Run Unit Tests
        run: |
          echo "=== Executing monorepo unit tests ==="
          yarn test --testPathIgnorePatterns="firestore" --runInBand

      - name: Teardown PostgreSQL Instance
        if: always()
        run: |
          docker rm -f pg-test >/dev/null 2>&1 || true

  publish:
    name: Publish Changed Packages to npm
    needs: ci
    runs-on: ubuntu-latest
    # develop publishes the `beta` dist-tag, main publishes `latest`.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Authenticate with npmjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Repository secret NPM_TOKEN is missing (Settings > Actions > Secrets)." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Sync with remote before publish
        run: |
          git config --global user.name "forgejo-actions"
          git config --global user.email "forgejo-actions@git.qtrn.io"
          git pull --rebase origin "${GITHUB_REF_NAME}" --autostash

      - name: Publish changed packages
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            yarn publish:all --tag beta --beta
          else
            yarn publish:all
          fi

      - name: Commit version bumps and hashes
        id: bump
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" --autostash
          git add -A packages/*/package.json .version_hashes.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version bump to commit."
            exit 0
          fi
          git commit --no-verify -m "chore: release versions & update hashes [skip ci]"
          git push --no-verify origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create temporal release tag on main
        if: github.ref == 'refs/heads/main' && steps.bump.outputs.changed == 'true'
        run: |
          git fetch --tags origin
          DATE_TAG="v$(date -u +'%Y.%m.%d')"
          TAG="$DATE_TAG"
          COUNTER=1
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            TAG="${DATE_TAG}.${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done
          git tag -a "$TAG" -m "Release $TAG [skip ci]"
          git push --no-verify origin "$TAG"

name: Quatrain Core Sovereign CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://127.0.0.1:2375

jobs:
  ci:
    name: Monorepo Build, Tests & Quality Audit
    runs-on: ubuntu-latest
    # Job image with Node.js, Corepack, the build toolchain and the Docker CLI already installed
    # (recipe: tycho/forge-ci, built by the fork of this forge). Pinned to a major version: fixes
    # arrive without a change here, a removed tool never does. The image is public.
    container:
      image: qtrn.io/qtrn-io/ci-base:1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show the toolchain
        run: |
          echo "ci-base ${CI_BASE_VERSION}, user $(id -un)"
          echo "Node.js $(node -v), Yarn $(yarn --version)"
          docker --version

      - name: Start Isolated PostgreSQL Test Instance
        # Runs share the DinD daemon: the container name and host port must be unique per run,
        # otherwise a concurrent run's teardown removes this run's database.
        run: |
          echo "=== Starting PostgreSQL 15 on DinD ==="
          PG_CONTAINER="pg-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          echo "PG_CONTAINER=${PG_CONTAINER}" >> "$GITHUB_ENV"
          docker run -d --name "$PG_CONTAINER" \
            -p 127.0.0.1::5432 \
            -e POSTGRES_DB=quatrain_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            postgres:15-alpine

          PG_PORT=$(docker port "$PG_CONTAINER" 5432/tcp | head -n1 | awk -F: '{print $NF}')
          echo "POSTGRES_PORT=${PG_PORT}" >> "$GITHUB_ENV"

          # pg_isready over TCP: the init phase only listens on the unix socket.
          for i in $(seq 1 30); do
            docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
          done
          echo "PostgreSQL test instance is ready on localhost:${PG_PORT}"

      - name: Install Monorepo Dependencies
        run: |
          echo "=== Installing dependencies ==="
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      # Runners are ephemeral: without a remote cache every run rebuilds every package.
      # The cache is used when the forge provides its settings (variables TURBO_API and
      # TURBO_TEAM, secrets TURBO_TOKEN and TURBO_REMOTE_CACHE_SIGNATURE_KEY); without them
      # Turborepo builds as before. Only develop and main write to it: an artifact written by
      # any other ref would be reused by the following builds.
      - name: Build Monorepo (Turbo)
        env:
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_CACHE: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          echo "=== Building all monorepo packages ==="
          yarn build

      - name: Audit JSDoc Quality Gate
        run: |
          echo "=== Checking JSDoc compliance in core packages ==="
          OUTPUT=$(npx ts-node scripts/audit-jsdoc.ts | grep -E "\[Missing\] packages/(auth|backend|storage|studio|testing|worker)" || true)
          if [ -n "$OUTPUT" ]; then
            echo "JSDoc regressions detected in core packages:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "JSDoc quality gate passed."

      - name: Run Unit Tests
        run: |
          echo "=== Executing monorepo unit tests ==="
          yarn test --testPathIgnorePatterns="firestore" --runInBand

      - name: Teardown PostgreSQL Instance
        if: always()
        run: |
          docker rm -f "${PG_CONTAINER:-pg-test-${GITHUB_RUN_ID}}" >/dev/null 2>&1 || true

  publish:
    name: Publish Changed Packages to npm
    needs: ci
    runs-on: ubuntu-latest
    # develop publishes the `beta` dist-tag, main publishes `latest`.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Install Monorepo Dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Authenticate with npmjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Repository secret NPM_TOKEN is missing (Settings > Actions > Secrets)." >&2
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Sync with remote before publish
        run: |
          git config --global user.name "forgejo-actions"
          git config --global user.email "forgejo-actions@git.qtrn.io"
          git pull --rebase origin "${GITHUB_REF_NAME}" --autostash

      # No remote cache here on purpose: what goes to npm is built on this runner.
      - name: Publish changed packages
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            yarn publish:all --tag beta --beta
          else
            yarn publish:all
          fi

      - name: Commit version bumps and hashes
        id: bump
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" --autostash
          git add -A packages/*/package.json .version_hashes.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version bump to commit."
            exit 0
          fi
          git commit --no-verify -m "chore: release versions & update hashes [skip ci]"
          git push --no-verify origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Packages are versioned independently: each released package gets its own tag,
      # @quatrain/<package>@<version>, on the commit that carries its new version.
      - name: Tag released packages on main
        if: github.ref == 'refs/heads/main' && steps.bump.outputs.changed == 'true'
        run: |
          git fetch --tags origin
          node bin/tag_released_packages.js --push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - 'bin/**'
      - 'package.json'
      - 'yarn.lock'
      - 'sonar-project.properties'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - 'bin/**'
      - 'package.json'
      - 'yarn.lock'
      - 'sonar-project.properties'
      - 'turbo.json'
      - '.github/workflows/ci.yml'



jobs:
  sonarcloud:
    name: SonarCloud Scan & Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quatrain_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clone for accurate SonarQube blame/authorship

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Java (required for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('packages/backend-firestore/firebase.json') }}

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build monorepo packages
        run: yarn build

      - name: Run unit tests with coverage
        run: npx firebase-tools emulators:exec --config packages/backend-firestore/firebase.json --only firestore "yarn test:coverage --runInBand"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish Independent Packages
    needs: sonarcloud
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      attest: ${{ steps.sbom.outputs.attest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Authenticate with registries
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc

      - name: Audit JSDoc for regressions
        run: |
          OUTPUT=$(npx ts-node scripts/audit-jsdoc.ts | grep -E "\\[Missing\\] packages/(auth|backend|storage|studio|testing|worker)" || true)
          if [ ! -z "$OUTPUT" ]; then
            echo "JSDoc missing in audited packages:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Sync with remote before publish
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" --autostash

      # --- SBOM gate: nothing is published if a package to release pulls a fixable critical CVE
      - name: Generate SBOMs of packages to release
        run: |
          FLAGS=""
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then FLAGS="--beta"; fi
          node bin/publish_all.js --plan "$RUNNER_TEMP/plan.json" $FLAGS
          node bin/sbom.js --plan "$RUNNER_TEMP/plan.json" --out "$RUNNER_TEMP/sbom-gate"

      - name: Download Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Vulnerability gate
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          shopt -s nullglob
          status=0
          for f in "$RUNNER_TEMP"/sbom-gate/*.cdx.json; do
            echo "::group::$(basename "$f")"
            "$GRYPE" "sbom:$f" --fail-on critical --only-fixed || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Publish all changed packages
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            yarn publish:all --tag beta --beta --manifest "$RUNNER_TEMP/published.json"
          else
            yarn publish:all --manifest "$RUNNER_TEMP/published.json"
          fi

      # --- Release SBOMs: one per published package, with final versions and tarball digests.
      # continue-on-error so that the version bumps are still committed; the job is failed at the end.
      - name: Generate SBOMs of published packages
        id: sbom
        continue-on-error: true
        run: |
          node bin/sbom.js --manifest "$RUNNER_TEMP/published.json" --out "$RUNNER_TEMP/sbom"
          echo "count=$(jq length "$RUNNER_TEMP/sbom/index.json")" >> "$GITHUB_OUTPUT"
          echo "attest=$(jq -c '[.[] | select(.sha256)]' "$RUNNER_TEMP/sbom/index.json")" >> "$GITHUB_OUTPUT"

      - name: Upload SBOMs
        if: steps.sbom.outcome == 'success' && steps.sbom.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          overwrite: true

      - name: Sync with remote to prevent push rejection
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" --autostash

      - name: Commit version bumps & hashes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5 # NOSONAR
        with:
          commit_message: "chore: release versions & update hashes [skip ci]"
          commit_options: '--no-verify'

      - name: Create and push temporal release tag on main
        if: github.ref == 'refs/heads/main' && steps.auto_commit.outputs.changes_detected == 'true'
        run: |
          git fetch --tags origin
          DATE_TAG="v$(date -u +'%Y.%m.%d')"
          TAG="$DATE_TAG"
          COUNTER=1
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            TAG="${DATE_TAG}.${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done
          echo "Creating temporal release tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG [skip ci]"
          git push origin "$TAG"

      - name: Fail if SBOM generation failed
        if: steps.sbom.outcome == 'failure'
        run: |
          echo "::error::Packages were published but their SBOMs could not be generated"
          exit 1

  # Signed SBOM attestation (Sigstore), bound to the sha256 of each tarball published on main.
  # Verify with:
  #   npm pack @quatrain/<pkg>@<version>
  #   gh attestation verify quatrain-<pkg>-<version>.tgz --repo Quatrain/Core --predicate-type https://cyclonedx.org/bom
  attest:
    name: Attest SBOM (${{ matrix.pkg.name }})
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.attest != '' && needs.publish.outputs.attest != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        pkg: ${{ fromJson(needs.publish.outputs.attest) }}
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.pkg.purl }}
          subject-digest: sha256:${{ matrix.pkg.sha256 }}
          sbom-path: sbom/${{ matrix.pkg.sbom }}

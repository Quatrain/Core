server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects to preserve https:// behind Traefik reverse proxy
    absolute_redirect off;
    port_in_redirect off;

    # Redirect root / to /core/
    location = / {
        return 301 /core/;
    }

    # Redirect /core to /core/
    location = /core {
        return 301 /core/;
    }

    # Handle accidental double prefix /core/core/
    location ~ ^/core/core/(.*)$ {
        return 301 /core/$1;
    }

    # Redirect requests missing /core prefix
    location ~ ^/(packages|okf|api-reference)(/.*)?$ {
        return 301 /core$request_uri;
    }

    # Case-insensitive redirects for HOWTO (e.g. /core/packages/auth-supabase/HOWTO -> /core/packages/auth-supabase/howto)
    location ~ ^/core/(.*)/HOWTO/?$ {
        return 301 /core/$1/howto;
    }

    # Case-insensitive redirects for README (e.g. /core/packages/auth-supabase/README -> /core/packages/auth-supabase/readme)
    location ~ ^/core/(.*)/README/?$ {
        return 301 /core/$1/readme;
    }

    # Package directory root: redirect to overview (readme)
    location ~ ^/core/packages/([^/]+)/?$ {
        return 301 /core/packages/$1/readme;
    }

    # Strip trailing slash from subpages to prevent directory index collisions (e.g. /core/okf/domain-modeling/ -> /core/okf/domain-modeling)
    location ~ ^/core/(.+)/$ {
        return 301 /core/$1;
    }

    # Cache static Next.js assets
    location ~* ^/core/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache static media/fonts
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Handle API reference static files directly
    location /core/api-reference/ {
        try_files $uri $uri/ =404;
    }

    # Handle Nextra static routing under /core/
    location /core/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404 Error handling
    error_page 404 /core/404.html;
    location = /core/404.html {
        internal;
    }
}


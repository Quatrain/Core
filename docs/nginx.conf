server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect root / to /core/
    location = / {
        return 301 /core/;
    }

    # Redirect /core to /core/
    location = /core {
        return 301 /core/;
    }

    # Handle Next.js static routing under /core/
    location /core/ {
        try_files $uri $uri.html $uri/ /core/index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 404 Error handling
    error_page 404 /core/404.html;
    location = /core/404.html {
        internal;
    }
}
